name: packages

# Builds the fork and runs the routing package tests (PackageSet, mjolnir.packages): once in a
# release build, once under ThreadSanitizer, as package sets are shared by every thread.

on:
  push:
    branches:
      - "**"
    tags:
      - "*-pkg.*"
    paths-ignore:
      - "*.md"
      - docs/
      - run_route_scripts/
      - test_requests/
  pull_request:
    paths-ignore:
      - "*.md"
      - docs/
      - run_route_scripts/
      - test_requests/
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package_tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: release
            build_type: Release
            cmake_flags: ""
            env: ""
          - name: thread-sanitizer
            build_type: Debug
            cmake_flags: -DENABLE_THREAD_SANITIZER=ON
            env: TSAN_OPTIONS=halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: ./scripts/install-linux-deps.sh

      - name: Get ccache dir
        run: echo "CCACHE_DIR=$(ccache --get-config cache_dir)" >> $GITHUB_ENV

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-packages-${{ matrix.name }}-${{ github.sha }}
          restore-keys: ccache-packages-${{ matrix.name }}-

      - name: Build
        run: |
          # ENABLE_THREAD_SAFE_TILE_REF_COUNT is on by default: package sets need it
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_SINGLE_FILES_WERROR=Off \
            -DENABLE_PYTHON_BINDINGS=Off -DENABLE_NODE_BINDINGS=Off ${{ matrix.cmake_flags }}
          make -C build -j$(nproc) valhalla_build_tile_refs valhalla_join_packages packageset gurka_packages

      # ThreadSanitizer cannot map its shadow memory with the runners' default ASLR entropy
      - name: Lower ASLR entropy
        if: matrix.name == 'thread-sanitizer'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Run package tests
        working-directory: build
        run: |
          env ${{ matrix.env }} ./test/packageset
          env ${{ matrix.env }} LOCPATH=../locales ./test/gurka/gurka_packages

  publish_image:
    name: Publish image (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-pkg.')
    needs: package_tests
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: runner
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/papaiatis/valhalla:${{ steps.tag.outputs.tag }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          build-args: |
            VERSION_MODIFIER=${{ steps.tag.outputs.tag }}

  merge_manifest:
    name: Merge multi-arch manifest
    if: startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-pkg.')
    needs: publish_image
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tag name
        id: tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/papaiatis/valhalla:${{ steps.tag.outputs.tag }} \
            ghcr.io/papaiatis/valhalla:${{ steps.tag.outputs.tag }}-amd64 \
            ghcr.io/papaiatis/valhalla:${{ steps.tag.outputs.tag }}-arm64
